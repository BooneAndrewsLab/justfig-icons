name: Release

# Builds the library from the pinned sources, validates it and attaches the
# reproducible tarball (and its SHA-256) to a GitHub Release when a v* tag is
# pushed. The app pins one release in its icons.lock.json (URL + SHA-256) and
# unpacks it into public/lib/<version>/ at deploy time.
#
# PLACEHOLDER: this repository is not on GitHub yet. Once it is, the release
# URL is https://github.com/BooneAndrewsLab/justfig-icons/releases/download/
# v<version>/justfig-icons-<version>.tar.gz — the URL the app's lock file uses.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}"
      - name: Fetch sources at their pinned commits
        run: npm run fetch
      - run: npm run build
      - name: Validate (zero licence errors)
        run: npm run validate
      - run: npm run pack
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="$(node -p 'require("./package.json").version')"
          gh release create "v$v" \
            "release/justfig-icons-$v.tar.gz" "release/justfig-icons-$v.tar.gz.sha256" \
            --title "Icon library $v" --notes-file REPORT.md
