# Controlled categories (plan §3). The app lists them in this order and opens
# the first one, so the first category is part of the first payload budget
# (manifest + first shard < 300 kB, checked by validate). `synonyms` feed the
# search index: an icon in the category is also found by these words.
categories:
  - id: cells
    title: Cells and tissues
    synonyms: [cell, cellular, tissue, histology]
  - id: organelles
    title: Organelles and membranes
    synonyms: [organelle, membrane, intracellular, subcellular, compartment]
  - id: proteins
    title: Proteins and molecules
    synonyms: [protein, peptide, molecule, enzyme, amino acid]
  - id: nucleic
    title: DNA, RNA and genetics
    synonyms: [dna, rna, gene, genetics, genome, nucleic acid, chromosome]
  - id: immunology
    title: Blood and immunology
    synonyms: [blood, immune, immunology, antibody, haematology, hematology]
  - id: microbes
    title: Microbes and viruses
    synonyms: [microbe, microbiology, bacteria, virus, pathogen, parasite, germ]
  - id: lab
    title: Lab equipment
    synonyms: [lab, laboratory, equipment, apparatus, instrument, bench]
  - id: organisms
    title: Animals and model organisms
    synonyms: [animal, organism, model organism, species]
  - id: plants
    title: Plants and algae
    synonyms: [plant, botany, algae, leaf, flower]
  - id: anatomy
    title: Anatomy and physiology
    synonyms: [anatomy, organ, body, physiology, human]
  - id: medical
    title: Medicine and health
    synonyms: [medical, medicine, health, clinic, clinical, hospital, treatment, disease]
  - id: chemistry
    title: Chemistry
    synonyms: [chemistry, chemical, compound, reaction]
  - id: people
    title: People
    synonyms: [person, people, human, patient, doctor]
  - id: data
    title: Graphs and data
    synonyms: [graph, chart, plot, data, statistics]
  - id: computing
    title: Computing and bioinformatics
    synonyms: [computer, computing, software, bioinformatics, machine learning, server]
  - id: symbols
    title: Symbols and signs
    synonyms: [symbol, sign, arrow, shape, icon, safety, warning, hazard]
  - id: objects
    title: Objects and places
    synonyms: [object, item, place, building, thing]

